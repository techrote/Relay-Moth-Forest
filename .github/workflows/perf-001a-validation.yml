name: PERF-001A validation

on:
  push:
    branches:
      - perf-001a/instrumentation-28

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install authoring, browser and GLES dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-authoring.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri

      - name: Full deterministic regression
        run: python self_test.py

      - name: Native browser correctness regression
        run: python tests/current/browser_render_regression_414.py --out /tmp/perf-001a-browser

      - name: PERF-001A timing evidence
        run: |
          python tests/current/state_change_performance_415.py \
            --out /tmp/perf-001a.json \
            --samples 3 \
            --cpu-throttle 1 \
            --cpu-throttle 4

      - name: Upload concise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-001a-evidence
          path: |
            /tmp/perf-001a.json
            /tmp/perf-001a-browser
          if-no-files-found: warn

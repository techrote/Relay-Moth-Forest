name: E415-11 candidate validation
on:
  push:
    branches: [e415-11/docs-release-consolidation-15]
permissions:
  contents: read
concurrency:
  group: e415-11-validation
  cancel-in-progress: true
jobs:
  release-validation:
    if: "!contains(github.event.head_commit.message, '[e415-transport]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact tested candidate
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authoring, EGL and native-browser dependencies
        run: |
          python -m pip install -r tools/requirements-authoring.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri
      - name: Require direct GLES context before validation
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'tests/support')
          from gles import GLES
          print('REQUIRED EGL CONTEXT:', GLES().version)
          PY
      - name: Full deterministic regression
        run: python self_test.py
      - name: Explicit editor, reserved surfaces and inherited renderer gates
        run: |
          node tests/current/editor_behavior_regression_415.js
          node tests/current/procedural_decor_regression_415.js
          node tests/current/render_contracts_414.js
          python tests/current/sprite_assets_regression_414.py
          python tests/current/sprite_pixels_regression_414.py --out /tmp/e415-11-pixels
          test -s /tmp/e415-11-pixels/pixel_results.json
          python tests/current/release_docs_regression_415.py
      - name: Native Chromium editor and all-room renderer regression
        run: python tests/current/browser_render_regression_414.py --out /tmp/e415-11-browser
      - name: Clean versioned package and unchanged-content verification
        run: |
          sha256sum -c SHA256SUMS.txt > /tmp/e415-11-source-checksums.txt
          git archive --format=tar HEAD -o /tmp/Relay-Moth-Forest-v4.15.tar
          mkdir /tmp/e415-11-clean
          tar -xf /tmp/Relay-Moth-Forest-v4.15.tar -C /tmp/e415-11-clean
          cd /tmp/e415-11-clean
          sha256sum -c SHA256SUMS.txt > /tmp/e415-11-clean-before.txt
          python self_test.py
          node tests/current/editor_behavior_regression_415.js
          node tests/current/procedural_decor_regression_415.js
          python tests/current/release_docs_regression_415.py
          sha256sum -c SHA256SUMS.txt > /tmp/e415-11-clean-after.txt
          echo CLEAN PACKAGE AND CHECKSUMS PASS
      - name: Retain concise diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e415-11-validation-reports
          path: |
            /tmp/e415-11-pixels/*.json
            /tmp/e415-11-browser/*.json
          if-no-files-found: ignore
          retention-days: 7

name: E415-08 validation

on:
  push:
    branches:
      - 'e415-08/semantic-validation-dirty-12'

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authoring/test dependencies
        run: python -m pip install -r tools/requirements-authoring.txt
      - name: Run repository self-test
        run: python self_test.py

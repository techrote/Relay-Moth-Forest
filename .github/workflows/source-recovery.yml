name: Recover exact PERF-004 source
on:
  push:
    branches: [maintenance/perf004-source-recovery-20261103]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 071b87b0d53b23f23d15a621246b76bf3c8502c4
          persist-credentials: false
      - name: Verify and archive the published source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 1a5bc8b466df077be36f8698ea93347b12fb2095
          python tools/source_manifest.py --check
          mkdir -p "$RUNNER_TEMP/relay-source-recovery"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/relay-source-recovery/source.tar.gz"
          sha256sum "$RUNNER_TEMP/relay-source-recovery/source.tar.gz" > "$RUNNER_TEMP/relay-source-recovery/source.sha256"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/relay-source-recovery/source.identity"
      - uses: actions/upload-artifact@v7
        with:
          name: relay-moth-source-recovery-071b87b0
          path: ${{ runner.temp }}/relay-source-recovery
          retention-days: 1
          if-no-files-found: error
